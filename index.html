<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Checker</title>
    <link rel="stylesheet" href="styles/weather_app.css">
    <script src="scripts/weather_app.js" defer></script>
</head>
<body>
    <div class="weather-app">
        <h1>Weather Checker</h1>
        <form id="weatherForm"><input type="text" id="cityInput" placeholder= "Enter city name" required></input>
            <button type="submit">Get Weather</button>
        </form>
        <div id="weatherResult" class="weather-result hidden"></div>
    </div>
</body>
</html>
